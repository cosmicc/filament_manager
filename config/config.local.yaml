app:
  base_url: http://localhost:8080
  timezone: America/Detroit
  log_level: INFO
  auth_mode: local
  allowed_hosts: [localhost, 127.0.0.1, filament-manager]
  cors_origins: [http://localhost:5173]
  secure_cookies: false
  data_dir: data
  static_dir: frontend/dist

database:
  url_file: secrets/filament-manager-database-url.txt
  pool_size: 10
  max_overflow: 10
  statement_timeout_ms: 30000

spoolman:
  base_url: http://localhost:7912
  public_url: http://localhost:7912
  request_timeout_seconds: 10
  full_reconcile_interval_minutes: 1

moonraker:
  printers:
    - id: flsun-qqs
      name: FLSun QQ-S
      base_url: http://flsun.internal.example:7125
      websocket_url: ws://flsun.internal.example:7125/websocket
      nozzle_diameter_mm: 0.6

google:
  enabled: false
  publish_interval_seconds: 30
  write_batch_size: 200
  unexpected_edit_policy: warn_and_overwrite

sync:
  max_retry_attempts: 12
  outbox_workers: 2
  outbox_lock_timeout_seconds: 300
  moonraker_state_interval_seconds: 5
  moonraker_print_interval_seconds: 5
  moonraker_info_interval_seconds: 300
  low_spool_threshold_percent: 25
  measurement_increase_tolerance_percent: 5
  measurement_increase_tolerance_g: 25

plates:
  allowed_codes: [P1, P2, P3, P4, P5]
  selection_policy: require
  verify_mesh_loaded: true

devices:
  scale_enabled: false
  nfc_enabled: false
  stable_window_seconds: 10
  stable_variance_g: 2
  replay_window_seconds: 300

security:
  session_lifetime_hours: 12
  session_idle_minutes: 60
  max_failed_logins: 5
  lockout_minutes: 15
