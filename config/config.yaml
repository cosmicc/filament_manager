app:
  base_url: https://filament-manager.internal.example
  timezone: America/Detroit
  log_level: INFO
  auth_mode: local
  allowed_hosts: [filament-manager.internal.example]
  cors_origins: []
  secure_cookies: true
  data_dir: /data
  static_dir: /app/static

database:
  pool_size: 10
  max_overflow: 10
  statement_timeout_ms: 30000

spoolman:
  base_url: http://spoolman_spoolman:8000
  public_url: http://spoolman.internal.example:7912
  request_timeout_seconds: 10
  full_reconcile_interval_minutes: 30

moonraker:
  printers:
    - id: flsun-qqs
      name: FLSun QQ-S
      base_url: http://flsun.internal.example:7125
      websocket_url: ws://flsun.internal.example:7125/websocket
      nozzle_diameter_mm: 0.6

google:
  enabled: true
  spreadsheet_id: REPLACE_WITH_NATIVE_GOOGLE_SHEET_ID
  publish_interval_seconds: 30
  write_batch_size: 200
  unexpected_edit_policy: warn_and_overwrite

sync:
  max_retry_attempts: 12
  outbox_workers: 2
  low_spool_threshold_percent: 25
  measurement_increase_tolerance_percent: 5
  measurement_increase_tolerance_g: 25

plates:
  allowed_codes: [P1, P2, P3, P4, P5]
  selection_policy: require
  verify_mesh_loaded: true

devices:
  scale_enabled: false
  nfc_enabled: false
  stable_window_seconds: 10
  stable_variance_g: 2
  replay_window_seconds: 300

security:
  session_lifetime_hours: 12
  session_idle_minutes: 60
  max_failed_logins: 5
  lockout_minutes: 15
