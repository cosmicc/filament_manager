[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "filament-manager-workstation-agent"
version = "0.1.2"
description = "Outbound-only Cura profile deployment agent for Filament Manager"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "defusedxml>=0.7.1,<1",
  "httpx>=0.28,<1",
  "platformdirs>=4.3,<5",
  "psutil>=7.0,<8",
  "pydantic>=2.11,<3",
  "structlog>=25.4,<26",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pip-audit>=2.9,<3",
  "pytest>=9.0.3,<10",
  "ruff>=0.12,<1",
  "types-defusedxml>=0.7.0.20250822,<1",
  "types-psutil>=7.0,<8",
]

[project.scripts]
filament-manager-agent = "filament_manager_agent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/filament_manager_agent"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC", "C4", "DTZ", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
