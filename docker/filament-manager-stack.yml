services:
  web:
    image: ${FILAMENT_MANAGER_IMAGE:?Set FILAMENT_MANAGER_IMAGE to an immutable version tag or digest}
    environment:
      FILAMENT_MANAGER_CONFIG: /config/config.yaml
    configs:
      - source: filament_manager_config
        target: /config/config.yaml
        mode: 0444
    secrets:
      - filament_manager_database_url
      - moonraker_api_key
      - google_service_account
    networks:
      - filament-services
    volumes:
      - filament_manager_data:/data
    ports:
      - target: 8080
        published: ${FILAMENT_MANAGER_PUBLIC_PORT:-8080}
        protocol: tcp
        mode: ingress
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        parallelism: 1
        order: stop-first

  worker:
    image: ${FILAMENT_MANAGER_IMAGE:?Set FILAMENT_MANAGER_IMAGE to an immutable version tag or digest}
    command: ["filament-manager-worker"]
    environment:
      FILAMENT_MANAGER_CONFIG: /config/config.yaml
    configs:
      - source: filament_manager_config
        target: /config/config.yaml
        mode: 0444
    secrets:
      - filament_manager_database_url
      - moonraker_api_key
      - google_service_account
    networks:
      - filament-services
    volumes:
      - filament_manager_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
        monitor: 30s

configs:
  filament_manager_config:
    external: true
    name: filament_manager_config_v1

secrets:
  filament_manager_database_url:
    external: true
  moonraker_api_key:
    external: true
  google_service_account:
    external: true

networks:
  filament-services:
    external: true
    name: ${FILAMENT_SERVICES_NETWORK:-filament-services}

volumes:
  filament_manager_data:
    external: true
