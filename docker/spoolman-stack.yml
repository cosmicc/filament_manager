services:
  spoolman:
    image: ${SPOOLMAN_IMAGE:-ghcr.io/donkie/spoolman:0.23.1}
    environment:
      TZ: ${TZ:-America/Detroit}
      SPOOLMAN_HOST: 0.0.0.0
      SPOOLMAN_PORT: "8000"
      SPOOLMAN_DB_TYPE: postgres
      SPOOLMAN_DB_HOST: ${POSTGRES_HOST:?Set POSTGRES_HOST to the central PostgreSQL host}
      SPOOLMAN_DB_PORT: ${POSTGRES_PORT:-5432}
      SPOOLMAN_DB_NAME: ${SPOOLMAN_DB_NAME:-spoolman}
      SPOOLMAN_DB_USERNAME: ${SPOOLMAN_DB_USERNAME:-spoolman_user}
      SPOOLMAN_DB_PASSWORD: ${SPOOLMAN_DB_PASSWORD:?Set SPOOLMAN_DB_PASSWORD}
      SPOOLMAN_DB_QUERY: ${SPOOLMAN_DB_QUERY:-ssl=require}
      SPOOLMAN_CORS_ORIGIN: ${SPOOLMAN_CORS_ORIGIN:?Set SPOOLMAN_CORS_ORIGIN to the exact Fluidd or browser origin}
      SPOOLMAN_METRICS_ENABLED: ${SPOOLMAN_METRICS_ENABLED:-TRUE}
    networks:
      - filament-services
    volumes:
      - spoolman_data:/home/app/.local/share/spoolman
    ports:
      - target: 8000
        published: ${SPOOLMAN_PUBLIC_PORT:-7912}
        protocol: tcp
        mode: ingress
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4).read()
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
        monitor: 45s
      rollback_config:
        parallelism: 1
        order: stop-first

networks:
  filament-services:
    external: true
    name: ${FILAMENT_SERVICES_NETWORK:-filament-services}

volumes:
  spoolman_data:
    external: true
    name: ${SPOOLMAN_DATA_VOLUME:-spoolman_data}
