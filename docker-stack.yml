version: "3.8"

x-filament-manager-environment: &filament-manager-environment
  FILAMENT_MANAGER_BASE_URL: ${FILAMENT_MANAGER_BASE_URL:?Set FILAMENT_MANAGER_BASE_URL to the public HTTPS URL}
  FILAMENT_MANAGER_ALLOWED_HOSTS: ${FILAMENT_MANAGER_ALLOWED_HOSTS:-}
  FILAMENT_MANAGER_CORS_ORIGINS: ${FILAMENT_MANAGER_CORS_ORIGINS:-}
  FILAMENT_MANAGER_SECURE_COOKIES: ${FILAMENT_MANAGER_SECURE_COOKIES:-true}
  FILAMENT_MANAGER_TIMEZONE: ${TZ:-America/Detroit}
  FILAMENT_MANAGER_LOG_LEVEL: ${FILAMENT_MANAGER_LOG_LEVEL:-INFO}
  FILAMENT_MANAGER_DATABASE_URL: "postgresql+psycopg://${FILAMENT_MANAGER_DB_USERNAME:-filament_user}:${FILAMENT_MANAGER_DB_PASSWORD:?Set FILAMENT_MANAGER_DB_PASSWORD}@${POSTGRES_HOST:?Set POSTGRES_HOST to the remote PostgreSQL host}:${POSTGRES_PORT:-5432}/${FILAMENT_MANAGER_DB_NAME:-filament_manager}?sslmode=${FILAMENT_MANAGER_DB_SSLMODE:-disable}"
  FILAMENT_MANAGER_DATABASE_POOL_SIZE: ${FILAMENT_MANAGER_DATABASE_POOL_SIZE:-10}
  FILAMENT_MANAGER_DATABASE_MAX_OVERFLOW: ${FILAMENT_MANAGER_DATABASE_MAX_OVERFLOW:-10}
  FILAMENT_MANAGER_DATABASE_STATEMENT_TIMEOUT_MS: ${FILAMENT_MANAGER_DATABASE_STATEMENT_TIMEOUT_MS:-30000}
  FILAMENT_MANAGER_DATABASE_AUTO_MIGRATE: ${FILAMENT_MANAGER_DATABASE_AUTO_MIGRATE:-true}
  FILAMENT_MANAGER_DATABASE_MIGRATION_LOCK_TIMEOUT_SECONDS: ${FILAMENT_MANAGER_DATABASE_MIGRATION_LOCK_TIMEOUT_SECONDS:-300}
  FILAMENT_MANAGER_SPOOLMAN_BASE_URL: ${SPOOLMAN_INTERNAL_URL:-http://spoolman:8000}
  FILAMENT_MANAGER_SPOOLMAN_PUBLIC_URL: ${SPOOLMAN_PUBLIC_URL:?Set SPOOLMAN_PUBLIC_URL to the stable LAN URL used by printers}
  FILAMENT_MANAGER_SPOOLMAN_REQUEST_TIMEOUT_SECONDS: ${SPOOLMAN_REQUEST_TIMEOUT_SECONDS:-10}
  FILAMENT_MANAGER_SPOOLMAN_RECONCILE_INTERVAL_MINUTES: ${SPOOLMAN_RECONCILE_INTERVAL_MINUTES:-1}
  FILAMENT_MANAGER_MOONRAKER_PRINTER_ID: ${MOONRAKER_PRINTER_ID:?Set MOONRAKER_PRINTER_ID}
  FILAMENT_MANAGER_MOONRAKER_PRINTER_NAME: ${MOONRAKER_PRINTER_NAME:?Set MOONRAKER_PRINTER_NAME}
  FILAMENT_MANAGER_MOONRAKER_BASE_URL: ${MOONRAKER_BASE_URL:?Set MOONRAKER_BASE_URL to the printer's Moonraker HTTP URL}
  FILAMENT_MANAGER_MOONRAKER_WEBSOCKET_URL: ${MOONRAKER_WEBSOCKET_URL:-}
  FILAMENT_MANAGER_MOONRAKER_API_KEY: ${MOONRAKER_API_KEY:-}
  FILAMENT_MANAGER_MOONRAKER_NOZZLE_DIAMETER_MM: ${MOONRAKER_NOZZLE_DIAMETER_MM:?Set MOONRAKER_NOZZLE_DIAMETER_MM}
  FILAMENT_MANAGER_GOOGLE_ENABLED: ${GOOGLE_ENABLED:-false}
  FILAMENT_MANAGER_GOOGLE_SPREADSHEET_ID: ${GOOGLE_SPREADSHEET_ID:-}
  FILAMENT_MANAGER_GOOGLE_SERVICE_ACCOUNT_JSON: ${GOOGLE_SERVICE_ACCOUNT_JSON:-}
  FILAMENT_MANAGER_GOOGLE_PUBLISH_INTERVAL_SECONDS: ${GOOGLE_PUBLISH_INTERVAL_SECONDS:-30}
  FILAMENT_MANAGER_GOOGLE_WRITE_BATCH_SIZE: ${GOOGLE_WRITE_BATCH_SIZE:-200}
  FILAMENT_MANAGER_GOOGLE_UNEXPECTED_EDIT_POLICY: ${GOOGLE_UNEXPECTED_EDIT_POLICY:-warn_and_overwrite}
  FILAMENT_MANAGER_SYNC_MAX_RETRY_ATTEMPTS: ${SYNC_MAX_RETRY_ATTEMPTS:-12}
  FILAMENT_MANAGER_SYNC_OUTBOX_WORKERS: ${SYNC_OUTBOX_WORKERS:-2}
  FILAMENT_MANAGER_SYNC_OUTBOX_LOCK_TIMEOUT_SECONDS: ${SYNC_OUTBOX_LOCK_TIMEOUT_SECONDS:-300}
  FILAMENT_MANAGER_MOONRAKER_STATE_INTERVAL_SECONDS: ${MOONRAKER_STATE_INTERVAL_SECONDS:-15}
  FILAMENT_MANAGER_MOONRAKER_PRINT_INTERVAL_SECONDS: ${MOONRAKER_PRINT_INTERVAL_SECONDS:-5}
  FILAMENT_MANAGER_MOONRAKER_INFO_INTERVAL_SECONDS: ${MOONRAKER_INFO_INTERVAL_SECONDS:-300}
  FILAMENT_MANAGER_LOW_SPOOL_THRESHOLD_PERCENT: ${LOW_SPOOL_THRESHOLD_PERCENT:-25}
  FILAMENT_MANAGER_MEASUREMENT_INCREASE_TOLERANCE_PERCENT: ${MEASUREMENT_INCREASE_TOLERANCE_PERCENT:-5}
  FILAMENT_MANAGER_MEASUREMENT_INCREASE_TOLERANCE_G: ${MEASUREMENT_INCREASE_TOLERANCE_G:-25}
  FILAMENT_MANAGER_PLATE_SELECTION_POLICY: ${PLATE_SELECTION_POLICY:-require}
  FILAMENT_MANAGER_VERIFY_MESH_LOADED: ${VERIFY_MESH_LOADED:-true}
  FILAMENT_MANAGER_SCALE_ENABLED: ${SCALE_ENABLED:-false}
  FILAMENT_MANAGER_NFC_ENABLED: ${NFC_ENABLED:-false}
  FILAMENT_MANAGER_STABLE_WINDOW_SECONDS: ${STABLE_WINDOW_SECONDS:-10}
  FILAMENT_MANAGER_STABLE_VARIANCE_G: ${STABLE_VARIANCE_G:-2}
  FILAMENT_MANAGER_REPLAY_WINDOW_SECONDS: ${REPLAY_WINDOW_SECONDS:-300}
  FILAMENT_MANAGER_SESSION_LIFETIME_HOURS: ${SESSION_LIFETIME_HOURS:-12}
  FILAMENT_MANAGER_SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-60}
  FILAMENT_MANAGER_MAX_FAILED_LOGINS: ${MAX_FAILED_LOGINS:-5}
  FILAMENT_MANAGER_LOCKOUT_MINUTES: ${LOCKOUT_MINUTES:-15}

services:
  spoolman:
    image: ${SPOOLMAN_IMAGE:-ghcr.io/donkie/spoolman:0.23.1}
    environment:
      TZ: ${TZ:-America/Detroit}
      SPOOLMAN_HOST: 0.0.0.0
      SPOOLMAN_PORT: "8000"
      SPOOLMAN_DB_TYPE: postgres
      SPOOLMAN_DB_HOST: ${POSTGRES_HOST:?Set POSTGRES_HOST to the remote PostgreSQL host}
      SPOOLMAN_DB_PORT: ${POSTGRES_PORT:-5432}
      SPOOLMAN_DB_NAME: ${SPOOLMAN_DB_NAME:-spoolman}
      SPOOLMAN_DB_USERNAME: ${SPOOLMAN_DB_USERNAME:-spoolman_user}
      SPOOLMAN_DB_PASSWORD: ${SPOOLMAN_DB_PASSWORD:?Set SPOOLMAN_DB_PASSWORD}
      SPOOLMAN_DB_QUERY: ${SPOOLMAN_DB_QUERY:-ssl=disable}
      SPOOLMAN_CORS_ORIGIN: ${SPOOLMAN_CORS_ORIGIN:?Set SPOOLMAN_CORS_ORIGIN to the exact Fluidd or browser origin}
      SPOOLMAN_METRICS_ENABLED: ${SPOOLMAN_METRICS_ENABLED:-TRUE}
    networks:
      - filament-services
    volumes:
      - spoolman_data:/home/app/.local/share/spoolman
    ports:
      - target: 8000
        published: ${SPOOLMAN_PUBLIC_PORT:-7912}
        protocol: tcp
        mode: ingress
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4).read()
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
        monitor: 45s
      rollback_config:
        parallelism: 1
        order: stop-first

  web:
    image: ${FILAMENT_MANAGER_IMAGE:?Set FILAMENT_MANAGER_IMAGE to an immutable version tag or digest}
    environment: *filament-manager-environment
    networks:
      - filament-services
    volumes:
      - filament_manager_data:/data
    ports:
      - target: 8080
        published: ${FILAMENT_MANAGER_PUBLIC_PORT:-8080}
        protocol: tcp
        mode: ingress
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        parallelism: 1
        order: stop-first

  worker:
    image: ${FILAMENT_MANAGER_IMAGE:?Set FILAMENT_MANAGER_IMAGE to an immutable version tag or digest}
    command: ["filament-manager-worker"]
    healthcheck:
      disable: true
    environment: *filament-manager-environment
    networks:
      - filament-services
    volumes:
      - filament_manager_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
        monitor: 30s

networks:
  filament-services:
    driver: overlay
    attachable: true

volumes:
  filament_manager_data:
  spoolman_data:
