name: Build and publish Swarm image

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: publish-swarm-image-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/filament-manager
  IMAGE_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  publish:
    if: >-
      ${{
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.IMAGE_COMMIT }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=sha-${{ env.IMAGE_COMMIT }}
          labels: |
            org.opencontainers.image.title=Filament Manager
            org.opencontainers.image.description=Self-hosted filament inventory, calibration, and printer integration
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=filament-manager
          cache-to: type=gha,mode=max,scope=filament-manager
          provenance: mode=max
          sbom: true

      - name: Verify the immutable manifest
        run: docker buildx imagetools inspect "${IMAGE_NAME}:sha-${IMAGE_COMMIT}"
