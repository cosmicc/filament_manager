[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "filament-manager"
version = "0.2.0"
description = "Self-hosted filament inventory, calibration, and printer integration"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "alembic>=1.16,<2",
  "argon2-cffi>=25.1,<26",
  "fastapi>=0.116,<1",
  "google-api-python-client>=2.180,<3",
  "google-auth>=2.40,<3",
  "httpx>=0.28,<1",
  "openpyxl>=3.1,<4",
  "prometheus-client>=0.22,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "PyYAML>=6.0,<7",
  "qrcode[pil]>=8.2,<9",
  "SQLAlchemy>=2.0.41,<3",
  "structlog>=25.4,<26",
  "typer>=0.16,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pip-audit>=2.9,<3",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.1,<2",
  "respx>=0.22,<1",
  "ruff>=0.12,<1",
  "testcontainers[postgres]>=4.12,<5",
  "types-PyYAML>=6.0,<7",
  "types-openpyxl>=3.1,<4",
  "types-qrcode>=8.2,<9",
]

[project.scripts]
filament-manager = "filament_manager.main:run"
filament-manager-cli = "filament_manager.cli:app"
filament-manager-worker = "filament_manager.workers.runner:run"
filament-manager-startup = "filament_manager.startup:run"

[tool.hatch.build.targets.wheel]
packages = ["src/filament_manager"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC", "C4", "DTZ", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]
"tests/**/*.py" = ["S101", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
mypy_path = "src"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: requires disposable PostgreSQL",
]
