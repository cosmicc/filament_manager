# FLSun QQ-S printer-specific Klipper macros
# Hardware, motion, print lifecycle, maintenance, and UI helper macros.
# Filament Manager integration is included LAST at the bottom of this file.
# Keep filament-manager_macros.cfg as the sole owner of managed spool state and public load/unload/M600 workflows.

[gcode_macro CHECK_PROBE_REMOVED]
description: Abort printing if calibration probe may still be attached
gcode:
    {% set saved = printer.save_variables.variables %}
    {% set probe_attached = saved.probe_attached|default(0)|int %}

    {% if probe_attached == 1 %}
        {action_raise_error(
            "CALIBRATION PROBE MAY STILL BE ATTACHED.\n"
            "Remove the probe, run PROBE_REMOVED, and restart the print."
        )}
    {% endif %}

[gcode_macro PROBE_REMOVED]
description: Confirm that the detachable probe was removed
gcode:
    SAVE_VARIABLE VARIABLE=probe_attached VALUE=0

    RESPOND TYPE=command MSG="action:prompt_end"
    RESPOND TYPE=echo MSG="Calibration probe removal confirmed."

    M117 Probe removed

[gcode_macro _PROBE_REMOVAL_PROMPT]
description: Display detachable-probe removal warning
gcode:
    M117 REMOVE PROBE

    RESPOND TYPE=command MSG="action:prompt_begin REMOVE CALIBRATION PROBE"
    RESPOND TYPE=command MSG="action:prompt_text Calibration is complete. Physically remove the detachable probe before homing or printing."
    RESPOND TYPE=command MSG="action:prompt_button Probe Removed|PROBE_REMOVED|primary"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro DELTA_CALIBRATE]
rename_existing: DELTA_CALIBRATE_BASE
description: Delta calibration with removable-probe interlock
gcode:
    # Assume the detachable probe is currently installed.
    SAVE_VARIABLE VARIABLE=probe_attached VALUE=1

    # Run Klipper's original DELTA_CALIBRATE command.
    DELTA_CALIBRATE_BASE {rawparams}

    # Calibration completed. Require probe removal.
    _PROBE_REMOVAL_PROMPT

[gcode_macro FILAMENT_MANAGER_BEFORE_MESH_CALIBRATE]
description: Preserve the removable-probe interlock without a duplicate mesh wrapper
gcode:
    SAVE_VARIABLE VARIABLE=probe_attached VALUE=1

[gcode_macro FILAMENT_MANAGER_AFTER_MESH_CALIBRATE]
description: Remind the operator to remove the probe after automatic calibration
gcode:
    {% if not (printer.manual_probe|default({})).is_active|default(false) %}
      G28
      _PROBE_REMOVAL_PROMPT
    {% endif %}

[gcode_macro BED_SURFACE]
description: Apply or remove a temporary build-surface Z offset
variable_tape_offset: 0.0
gcode:
  {% set new_offset = params.OFFSET|default(0)|float %}
  {% set old_offset = printer["gcode_macro BED_SURFACE"].tape_offset|float %}
  {% if new_offset < -1 or new_offset > 1 %}
    {action_raise_error("BED_SURFACE OFFSET must be between -1.0 and 1.0 mm")}
  {% else %}
    SET_GCODE_OFFSET Z_ADJUST={new_offset - old_offset}
    SET_GCODE_VARIABLE MACRO=BED_SURFACE VARIABLE=tape_offset VALUE={new_offset}
    {action_respond_info("Build surface Z offset: " ~ new_offset ~ " mm")}
  {% endif %}

[idle_timeout]
timeout: 600
gcode:
  {% set print_state = printer.print_stats.state|lower %}
  {% set skip_schedule = printer["gcode_macro _POWER_OFF_TIMER_STATE"].skip_next_idle_schedule|int %}

  {% if print_state == "printing" or print_state == "paused" %}

    {action_respond_info("IDLE: Idle timeout ignored - print job is active")}
    {action_respond_info("IDLE: Current print state: %s" % print_state)}
    M117 Printing

  {% else %}

    {action_respond_info("IDLE: Idle timeout reached after 600 seconds")}
    M117 Idle

    {action_respond_info("IDLE: Turning off all heaters")}
    TURN_OFF_HEATERS

    {action_respond_info("IDLE: Homing printer")}
    G28

    {action_respond_info("IDLE: Disabling stepper motors")}
    M84

    {action_respond_info("IDLE: Turning off hotend LED")}
    HOTEND_LED C=WHITE B=0

    {% if skip_schedule %}

      {action_respond_info("POWER: Existing power-off countdown was manually reset and will continue")}
      SET_GCODE_VARIABLE MACRO=_POWER_OFF_TIMER_STATE VARIABLE=skip_next_idle_schedule VALUE=0

    {% else %}

      UPDATE_DELAYED_GCODE ID=DELAYED_PRINTEROFF_15 DURATION=0
      UPDATE_DELAYED_GCODE ID=DELAYED_PRINTEROFF_10 DURATION=0
      UPDATE_DELAYED_GCODE ID=DELAYED_PRINTEROFF_5 DURATION=0
      UPDATE_DELAYED_GCODE ID=DELAYED_PRINTEROFF DURATION=0

      {action_respond_info("POWER: Starting automatic power-off countdown")}
      {action_respond_info("POWER: Printer will power off in 30 minutes if it remains idle")}

      UPDATE_DELAYED_GCODE ID=DELAYED_PRINTEROFF_15 DURATION=900
      _POWER_OFF_TIMER_RECORD SECONDS=1800

    {% endif %}

  {% endif %}


[delayed_gcode DELAYED_PRINTEROFF_15]
gcode:
  {% if printer.idle_timeout.state == "Idle" %}
    {action_respond_info("POWER: Printer is still idle. Automatic power off in 15 minutes")}
    M117 Power off in 15 min
    UPDATE_DELAYED_GCODE ID=DELAYED_PRINTEROFF_10 DURATION=300
  {% else %}
    {action_respond_info("POWER: Printer is no longer idle. Automatic power-off countdown cancelled")}
    SET_GCODE_VARIABLE MACRO=_POWER_OFF_TIMER_STATE VARIABLE=active VALUE=0
    M117 Power off cancelled
  {% endif %}


[delayed_gcode DELAYED_PRINTEROFF_10]
gcode:
  {% if printer.idle_timeout.state == "Idle" %}
    {action_respond_info("POWER: Printer is still idle. Automatic power off in 10 minutes")}
    M117 Power off in 10 min
    UPDATE_DELAYED_GCODE ID=DELAYED_PRINTEROFF_5 DURATION=300
  {% else %}
    {action_respond_info("POWER: Printer is no longer idle. Automatic power-off countdown cancelled")}
    SET_GCODE_VARIABLE MACRO=_POWER_OFF_TIMER_STATE VARIABLE=active VALUE=0
    M117 Power off cancelled
  {% endif %}


[delayed_gcode DELAYED_PRINTEROFF_5]
gcode:
  {% if printer.idle_timeout.state == "Idle" %}
    {action_respond_info("POWER: Printer is still idle. Automatic power off in 5 minutes")}
    M117 Power off in 5 min
    UPDATE_DELAYED_GCODE ID=DELAYED_PRINTEROFF DURATION=300
  {% else %}
    {action_respond_info("POWER: Printer is no longer idle. Automatic power-off countdown cancelled")}
    SET_GCODE_VARIABLE MACRO=_POWER_OFF_TIMER_STATE VARIABLE=active VALUE=0
    M117 Power off cancelled
  {% endif %}


[delayed_gcode DELAYED_PRINTEROFF]
gcode:
  {% if printer.idle_timeout.state == "Idle" %}
    {action_respond_info("POWER: Automatic shutdown timer expired")}
    {action_respond_info("POWER: Printer remained idle for the entire countdown")}
    {action_respond_info("POWER: Shutting off printer power now")}
    M117 Powering off
    SET_GCODE_VARIABLE MACRO=_POWER_OFF_TIMER_STATE VARIABLE=active VALUE=0
    POWER_OFF_PRINTER
  {% else %}
    {action_respond_info("POWER: Automatic shutdown cancelled because printer is no longer idle")}
    SET_GCODE_VARIABLE MACRO=_POWER_OFF_TIMER_STATE VARIABLE=active VALUE=0
    M117 Power off cancelled
  {% endif %}

[gcode_macro _POWER_OFF_TIMER_STATE]
variable_skip_next_idle_schedule: 0
variable_active: 0
variable_deadline: 0.0
gcode:

# Observable clock uses the same MCU time returned by Moonraker, without polling.
[gcode_macro _POWER_OFF_TIMER_RECORD]
gcode:
  {% set seconds = params.SECONDS|default(0)|int %}
  {% if seconds > 0 and seconds <= 3600 %}
    SET_GCODE_VARIABLE MACRO=_POWER_OFF_TIMER_STATE VARIABLE=deadline VALUE={printer.toolhead.estimated_print_time|float + seconds}
    SET_GCODE_VARIABLE MACRO=_POWER_OFF_TIMER_STATE VARIABLE=active VALUE=1
  {% endif %}

[gcode_macro RESET_POWER_OFF_TIMER]
description: Restart Automatic Power-Off Timer
gcode:
  {% if printer.idle_timeout.state == "Printing" or printer.pause_resume.is_paused %}
    {action_respond_info("POWER: Cannot reset automatic power-off timer while a print is active")}
    M117 Print active
  {% else %}
    {action_respond_info("POWER: Manually restarting automatic power-off countdown")}

    UPDATE_DELAYED_GCODE ID=DELAYED_PRINTEROFF_15 DURATION=0
    UPDATE_DELAYED_GCODE ID=DELAYED_PRINTEROFF_10 DURATION=0
    UPDATE_DELAYED_GCODE ID=DELAYED_PRINTEROFF_5 DURATION=0
    UPDATE_DELAYED_GCODE ID=DELAYED_PRINTEROFF DURATION=0

    SET_GCODE_VARIABLE MACRO=_POWER_OFF_TIMER_STATE VARIABLE=skip_next_idle_schedule VALUE=1

    UPDATE_DELAYED_GCODE ID=DELAYED_PRINTEROFF_15 DURATION=2700
    _POWER_OFF_TIMER_RECORD SECONDS=3600

    {action_respond_info("POWER: Automatic power-off timer reset to 60 minutes")}
    {action_respond_info("POWER: Shutdown warnings will occur at 15, 10, and 5 minutes remaining")}
    M117 Power off in 60 min
  {% endif %}

[delayed_gcode DELAYED_EXHAUSTOFF]
initial_duration: 300
gcode:
  SET_FAN_SPEED FAN=exhaust SPEED=0
  {% if printer.idle_timeout.state == "Printing" %}
    EXHAUST_LOOP
  {% endif %}

[delayed_gcode ENDPRINT_EXHAUSTOFF]
initial_duration: 300
gcode:
    SET_FAN_SPEED FAN=exhaust SPEED=0

[gcode_macro EXHAUST_LOOP]
gcode:
    {% if printer.idle_timeout.state == "Printing" %}
    UPDATE_DELAYED_GCODE ID=DELAYED_EXHAUST_TRIGGER DURATION=310
    {% endif %}

[delayed_gcode DELAYED_EXHAUST_TRIGGER]
initial_duration: 300
gcode:
  {% if printer.idle_timeout.state == "Printing" %}
  EXHAUST_TRIGGER
  {% endif %}

[gcode_macro EXHAUST_TRIGGER]
gcode:
    EXHAUSTON
    UPDATE_DELAYED_GCODE ID=DELAYED_EXHAUSTOFF DURATION=15

[gcode_macro EXHAUST_FIVE_MINUTES]
description: Run chamber exhaust for five minutes
gcode:
  EXHAUSTON
  UPDATE_DELAYED_GCODE ID=ENDPRINT_EXHAUSTOFF DURATION=300

[gcode_macro EXHAUST_TEN_MINUTES]
description: Run chamber exhaust for ten minutes
gcode:
  EXHAUSTON
  UPDATE_DELAYED_GCODE ID=ENDPRINT_EXHAUSTOFF DURATION=600

[gcode_macro START_PRINT]
description: Print Job Starting
variable_bed_temp: 0
variable_extruder_temp: 0
variable_chamber_temp: 0
variable_waiting_for_mesh: 0
variable_resume_sd: 0
gcode:
  # A new print cancels the previous idle-only shutdown chain.
  UPDATE_DELAYED_GCODE ID=DELAYED_PRINTEROFF_15 DURATION=0
  UPDATE_DELAYED_GCODE ID=DELAYED_PRINTEROFF_10 DURATION=0
  UPDATE_DELAYED_GCODE ID=DELAYED_PRINTEROFF_5 DURATION=0
  UPDATE_DELAYED_GCODE ID=DELAYED_PRINTEROFF DURATION=0
  SET_GCODE_VARIABLE MACRO=_POWER_OFF_TIMER_STATE VARIABLE=active VALUE=0
  SET_GCODE_VARIABLE MACRO=_POWER_OFF_TIMER_STATE VARIABLE=skip_next_idle_schedule VALUE=0

  {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
  {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}
  {% set CHAMBER_TEMP = params.CHAMBER_TEMP|default(0)|float %}
  SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=bed_temp VALUE={BED_TEMP}
  SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=extruder_temp VALUE={EXTRUDER_TEMP}
  SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=chamber_temp VALUE={CHAMBER_TEMP}
  SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=waiting_for_mesh VALUE=0
  SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=resume_sd VALUE={1 if printer.virtual_sdcard.is_active else 0}
  _START_PRINT_MESH_CHECK

[gcode_macro _START_PRINT_CONTINUE]
gcode:
  {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
  {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}
  {% set CHAMBER_TEMP = params.CHAMBER_TEMP|default(0)|float %}
  {% set RESUME_SD = params.RESUME_SD|default(0)|int %}
  {% set PREHEAT_TEMP = [EXTRUDER_TEMP - 30, 170]|min %}
  CHECK_PROBE_REMOVED
  LIGHTON
  HOTEND_LED C=RED
  EXHAUSTOFF
  M107
  M117 Preheating
  # Bed - set target without waiting
  M140 S{BED_TEMP}
  # Chamber - set target without waiting
  {% if CHAMBER_TEMP > 0 %}
    M141 S{CHAMBER_TEMP}
  {% endif %}
  # Hotend - bring to safe standby temperature
  M104 S{PREHEAT_TEMP}
  G90
  M117 Homing
  G28
  M117 Parking
  PARK_NOZZLE
  {% if CHAMBER_TEMP > 0 %}
    M117 Heating bed
    # Wait until bed is within 5C of target
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={BED_TEMP - 5}
    M117 Heating chamber
    # Wait until chamber is within 5C of target
    TEMPERATURE_WAIT SENSOR="heater_generic chamber" MINIMUM={CHAMBER_TEMP - 5}
    # Bed and chamber are now nearly ready
    M117 Heating nozzle
    M104 S{EXTRUDER_TEMP}
    # Verify bed has completely reached target
    M190 S{BED_TEMP}
    # Verify chamber has completely reached target
    M191 S{CHAMBER_TEMP}
    # Nozzle should finish last
    M109 S{EXTRUDER_TEMP}
  {% else %}
    M117 Heating bed
    # Wait until bed is within 5C of target
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={BED_TEMP - 5}
    # Start final hotend ramp
    M117 Heating nozzle
    M104 S{EXTRUDER_TEMP}
    # Finish bed heating
    M190 S{BED_TEMP}
    # Finish hotend heating
    M109 S{EXTRUDER_TEMP}
  {% endif %}
  HOTEND_LED C=WHITE
  # Print the starting purge lines
  PURGE_LINES
  M117 Printing
  EXHAUST_LOOP
  {% if RESUME_SD %}
    SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=resume_sd VALUE=0
    M24
  {% endif %}

[gcode_macro PURGE_LINES]
description: Start Print Purge Line
gcode:
 M117 Purge Lines
  # Absolute XYZ coordinates
  G90
  # Relative extrusion for purge routine
  M83
  G92 E0
  # -------------------------------------------------
  # PURGE LINE 1
  # Extreme front of build plate
  # Approx. 53 mm long
  # Right -> Left
  # -------------------------------------------------
  # Move above first purge line
  G1 X26.5 Y-122.0 Z3 F6000
  # Lower to purge height
  G1 Z0.4 F3000
  # First purge line
  G1 X-26.5 Y-122.0 E12 F1200
  # -------------------------------------------------
  # PURGE LINE 2
  # Slightly farther into build plate
  # Approx. 76 mm long
  # Left -> Right
  # -------------------------------------------------
  # Move to start of second line
  G1 X-38.0 Y-119.0 F6000
  # Second purge line
  G1 X38.0 Y-119.0 E17 F1200
  # Small retract before lifting
  G1 E-0.5 F3000
  # Lift away from purge lines
  G1 Z3 F3000
  # Restore retraction before handing control to Cura
  G1 E0.5 F3000
  # Cura uses absolute extrusion
  M82
  G92 E0

[gcode_macro END_PRINT]
description: Print Job Complete
gcode:
    {% set current_z = printer.toolhead.position.z|float %}
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set cone_start_z = printer.toolhead.cone_start_z|float %}
    {% set z_lift = [10.0, max_z - current_z]|min %}
    {% set final_z = current_z + z_lift %}
    M400
    M117 Print Complete
    # Retract only when the hotend is still warm enough
    {% if printer.extruder.can_extrude %}
        M83
        G1 E-2.0 F1800
    {% endif %}
    # Raise the nozzle without exceeding maximum Z
    G91
    {% if z_lift > 0 %}
        G1 Z{z_lift} F3000
    {% endif %}
    G90
    # At lower Z, park toward the rear.
    # Near the top of the delta volume, park at center because
    # radial movement becomes increasingly restricted.
    {% if final_z <= cone_start_z %}
        G1 X0 Y100 F6000
    {% else %}
        G1 X0 Y0 F6000
    {% endif %}
    M400
    # Capture the completed print after moving the nozzle away
    TIMELAPSE_TAKE_FRAME
    # Turn off hotend, bed, and chamber heaters
    TURN_OFF_HEATERS
    # Turn off part-cooling fan
    M107
    # Run chamber exhaust for five more minutes
    EXHAUSTON
    HOTEND_LED C=GREEN
    G92 E0
    M82
    BED_SURFACE OFFSET=0
    G28
    FILAMENT_MANAGER_PRINT_COMPLETE
    RESPOND TYPE=command MSG="action:prompt_begin Print Complete"
    RESPOND TYPE=command MSG="action:prompt_text You can remove the print from the build plate"
    RESPOND TYPE=command MSG="action:prompt_footer_button OK|FILAMENT_MANAGER_PRINT_ACKNOWLEDGE|primary"
    RESPOND TYPE=command MSG="action:prompt_show"
    UPDATE_DELAYED_GCODE ID=ENDPRINT_EXHAUSTOFF DURATION=300

[gcode_macro _START_PRINT_MESH_CHECK]
gcode:
  {% set START = printer["gcode_macro START_PRINT"] %}
  {% set active_plate = printer["gcode_macro SELECT_BUILD_PLATE"].active_plate|string %}
  {% set loaded_mesh = printer.bed_mesh.profile_name|default("")|string %}
  {% if active_plate == "UNSET" or not loaded_mesh or loaded_mesh != active_plate %}
    SET_GCODE_VARIABLE MACRO=START_PRINT VARIABLE=waiting_for_mesh VALUE=1
    M117 Select Build Plate
    {% if printer.virtual_sdcard.is_active %}
      M25
    {% endif %}
    SELECT_BUILD_PLATE
  {% else %}
    {action_respond_info("Using build plate " ~ active_plate ~ " with mesh " ~ loaded_mesh)}
    _START_PRINT_CONTINUE BED_TEMP={START.bed_temp} EXTRUDER_TEMP={START.extruder_temp} CHAMBER_TEMP={START.chamber_temp}
  {% endif %}

[gcode_macro M117]
rename_existing: M117.1
gcode:
  M117.1 {rawparams}
  {action_respond_info(rawparams)}

[gcode_macro FILAMENT_RUNOUT]
gcode:
  M117 Filament Runout Detected
  PAUSE

[delayed_gcode PRINTER_STARTUP]
initial_duration: 3
gcode:
  LIGHTON
  CHECK_PROBE_REMOVED
  G28
  SELECT_BUILD_PLATE

[gcode_macro POWER_OFF_PRINTER]
gcode:
  M117 Powering Down
  {% if printer.idle_timeout.state == "Idle" %}
  LIGHTOFF
  {action_call_remote_method("set_device_power",
                             device="printer",
                             state="off")}
  {% endif %}

[gcode_macro EXHAUSTON]
gcode:
  SET_FAN_SPEED FAN=exhaust SPEED=1

[gcode_macro EXHAUSTOFF]
gcode:
  SET_FAN_SPEED FAN=exhaust SPEED=0

[gcode_macro WARMUP]
description: Warm Up Printer
gcode:
  {% set BED_TEMP = params.BED_TEMP|default(50)|float %}
  {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(140)|float %}
  {% set CHAMBER_TEMP = params.CHAMBER_TEMP|default(30)|float %}
  {% if printer.idle_timeout.state == "Printing" or printer.pause_resume.is_paused %}
    {action_respond_info("WARMUP cannot be used while printing or paused")}
  {% else %}
    EXHAUSTOFF
    M117 Warming Up
    M140 S{BED_TEMP}
    M104 S{EXTRUDER_TEMP}
    M141 S{CHAMBER_TEMP}
    HOTEND_LED C=YELLOW
  {% endif %}

[gcode_macro COOLDOWN]
description: Cool Down Printer
gcode:
  {% if printer.idle_timeout.state == "Printing" or printer.pause_resume.is_paused %}
    {action_respond_info("COOLDOWN cannot be used while printing or paused")}
  {% else %}
    M117 Cooling Down
    TURN_OFF_HEATERS
    M107
    EXHAUSTON
    UPDATE_DELAYED_GCODE ID=DELAYED_EXHAUSTOFF DURATION=300
    HOTEND_LED C=BLUE
  {% endif %}

[gcode_macro PARK_NOZZLE]
description: Park Nozzle
gcode:
  {% set default_x = printer.toolhead.axis_maximum.x|float %}
  {% set default_y = 0.0 %}
  {% if "save_variables" in printer %}
    {% set svv = printer.save_variables.variables %}
    {% if "park_x" in svv %}{% set default_x = svv.park_x|float %}{% endif %}
    {% if "park_y" in svv %}{% set default_y = svv.park_y|float %}{% endif %}
  {% endif %}
  {% set x = params.X|default(default_x)|float %}
  {% set y = params.Y|default(default_y)|float %}
  {% set z_req = params.Z|default(200)|float %}
  {% set z = [z_req, printer.toolhead.cone_start_z|float]|min %}
  {% set z = [z, printer.toolhead.axis_minimum.z|float]|max %}
  {% set homed = printer.toolhead.homed_axes %}
  {% if "x" not in homed or "y" not in homed or "z" not in homed %}
    M117 Homing Printhead
    G28
  {% endif %}
    M117 Parking Printhead
    G90
    G1 Z{z} F4800
    G1 X{x} Y{y} F4800

[gcode_macro G28]
rename_existing: G28.1
description: Refuse homing over a paused print
gcode:
  {% if printer.pause_resume.is_paused %}
    {action_raise_error("Cancel the paused print before homing; its return position must remain valid")}
  {% else %}
    G28.1 {rawparams}
  {% endif %}

[gcode_macro WIPE_NOZZLE]
description: Wipe Nozzle
gcode:
  {% set min_temp = params.MIN_TEMP|default(150)|float %}
  {% set x = params.X|default(123)|float %}
  {% set z = params.Z|default(100)|float %}
  {% set z = [z, printer.toolhead.cone_start_z|float]|min %}
  {% set homed = printer.toolhead.homed_axes %}
  {% if printer.idle_timeout.state == "Printing" or printer.pause_resume.is_paused %}
    {action_respond_info("WIPE_NOZZLE cannot be used during a print")}
  {% elif printer.extruder.temperature < min_temp %}
    {action_respond_info("Extruder temperature too low")}
  {% else %}
    {% if "x" not in homed or "y" not in homed or "z" not in homed %}
      M117 Homing Printhead
      G28
    {% endif %}
    SAVE_GCODE_STATE NAME=WIPE_state
    M117 Wiping Nozzle
    G90
    G0 Z{z} F4800
    G0 X{x} Y16
    G0 X{x} Y-5
    G0 X{x} Y5
    G0 X{x-5} Y5
    G0 X{x} Y5
    G0 X100 Y5
    RESTORE_GCODE_STATE NAME=WIPE_state MOVE=0
  {% endif %}

[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
description: Capture one print position and park safely until resumed
variable_valid: 0
variable_x: 0.0
variable_y: 0.0
variable_safe_z: 0.0
variable_parked: 0
variable_retracted: 0.0
variable_tool: "extruder"
gcode:
  {% set active = printer.print_stats.state in ["printing", "paused"] or printer.virtual_sdcard.is_active %}
  {% set homed = printer.toolhead.homed_axes %}
  {% set tool = printer.toolhead.extruder %}
  {% set pending = printer["gcode_macro FILAMENT_MANAGER_SPOOL_STATE"].start_pending|int %}
  {% if printer.pause_resume.is_paused %}
    {action_respond_info("Already paused; original print position retained")}
  {% elif not active %}
    {action_respond_info("No active print to pause")}
  {% else %}
    # Klipper captures PAUSE_STATE before any retract or parking movement.
    BASE_PAUSE
    SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=valid VALUE=0
    SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=parked VALUE=0
    SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=retracted VALUE=0
    {% if "xyz" != homed or pending %}
      {action_respond_info("Print held without motion: homing or preflight is incomplete")}
    {% else %}
      SAVE_GCODE_STATE NAME=FM_PRINT_PAUSE
      {% set pos = printer.gcode_move.gcode_position %}
      {% set z = printer.toolhead.position.z|float %}
      {% set cone = printer.toolhead.cone_start_z|float %}
      {% set sv = printer.save_variables.variables %}
      {% set x = params.X|default(sv.park_x|default(printer.toolhead.axis_maximum.x))|float %}
      {% set y = params.Y|default(sv.park_y|default(0))|float %}
      {% set lift = [[params.Z|default(10)|float, 0]|max, [cone-z, 0]|max]|min %}
      {% set retract = [[params.E|default(1.5)|float, 0]|max, 5]|min if printer[tool].can_extrude else 0 %}
      # Avoid lowering into a tall model to reach the normal fixed-Z park.
      {% set radius = printer.toolhead.axis_maximum.x|float %}
      {% set offset_x = printer.toolhead.position.x|float - pos.x|float %}
      {% set offset_y = printer.toolhead.position.y|float - pos.y|float %}
      {% set park_ok = z < cone and lift > 0 and (x+offset_x)**2 + (y+offset_y)**2 <= radius**2 %}
      SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=x VALUE={pos.x}
      SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=y VALUE={pos.y}
      SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=safe_z VALUE={pos.z|float + (lift if park_ok else 0)}
      SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=tool VALUE="'{tool}'"
      SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=valid VALUE=1
      HOTEND_LED C=YELLOW
      {% if retract > 0 %}
        M83
        G1 E-{retract} F2100
        SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=retracted VALUE={retract}
      {% endif %}
      {% if park_ok %}
        G91
        G1 Z{lift} F3000
        G90
        G1 X{x} Y{y} F6000
        SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=parked VALUE=1
      {% else %}
        {action_respond_info("Paused without XY parking: insufficient safe delta clearance or invalid park position")}
      {% endif %}
      RESTORE_GCODE_STATE NAME=FM_PRINT_PAUSE MOVE=0
    {% endif %}
    M117 Print Paused
  {% endif %}

[gcode_macro RESUME]
rename_existing: BASE_RESUME
description: Return above the saved print position before descending and resuming
gcode:
  {% set saved = printer["gcode_macro PAUSE"] %}
  {% set state = printer["gcode_macro FILAMENT_MANAGER_SPOOL_STATE"] %}
  {% set speed = params.VELOCITY|default(50)|float %}
  {% if not printer.pause_resume.is_paused %}
    {action_respond_info("Print is not paused")}
  {% elif not saved.valid|int or printer.toolhead.homed_axes != "xyz" %}
    {action_raise_error("Resume position is not safe; cancel this print rather than homing over it")}
  {% elif state.phase != "idle" or state.start_pending|int %}
    {action_raise_error("Finish the Filament Manager prompt before resuming")}
  {% elif printer.toolhead.extruder != saved.tool %}
    {action_raise_error("Select the original hotend with its safe tool macro before resuming")}
  {% elif not printer[saved.tool].can_extrude %}
    {action_raise_error("Reheat the selected hotend before resuming")}
  {% elif speed <= 0 or speed > 100 %}
    {action_raise_error("Resume velocity must be above zero and at most 100 mm/s")}
  {% else %}
    # Restore the saved coordinate/extrusion modes without moving yet.
    RESTORE_GCODE_STATE NAME=FM_PRINT_PAUSE MOVE=0
    _QQS_RESUME_RETURN VELOCITY={speed}
  {% endif %}

[gcode_macro _QQS_RESUME_RETURN]
description: Internal second-stage return after restoring the original coordinate frame
gcode:
  {% set saved = printer["gcode_macro PAUSE"] %}
  {% set current = printer.gcode_move.gcode_position %}
  {% if not printer.pause_resume.is_paused or not saved.valid|int %}
    {action_raise_error("No saved paused print to return to")}
  {% elif current.z|float > saved.safe_z|float + 0.01 %}
    {action_raise_error("Nozzle was raised beyond the saved safe return height; cancel or restore the parked height before resuming")}
  {% elif not saved.parked|int and ((current.x|float-saved.x|float)|abs > 0.01 or (current.y|float-saved.y|float)|abs > 0.01) %}
    {action_raise_error("High-Z paused position changed; automatic XY return is unsafe")}
  {% else %}
    HOTEND_LED C=WHITE
    {% if saved.retracted|float > 0 %}
      M83
      G1 E{saved.retracted} F2100
      SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=retracted VALUE=0
    {% endif %}
    {% if saved.parked|int %}
      G90
      G1 Z{saved.safe_z} F3000
      G1 X{saved.x} Y{saved.y} F{params.VELOCITY|float * 60}
    {% endif %}
    # Native restore descends to PAUSE_STATE, restores all original modes,
    # then releases the print stream. Never resume before this completes.
    BASE_RESUME VELOCITY={params.VELOCITY|float}
    SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=valid VALUE=0
    M117 Printing
  {% endif %}

[gcode_macro M25]
rename_existing: M25.1
description: Route in-print SD pauses through position capture and parking
gcode:
  {% set state = printer["gcode_macro FILAMENT_MANAGER_SPOOL_STATE"] %}
  {% if state.start_pending|int or printer["gcode_macro START_PRINT"].waiting_for_mesh|int %}
    M25.1
  {% elif printer.print_stats.state in ["printing", "paused"] %}
    PAUSE
  {% else %}
    M25.1
  {% endif %}

[gcode_macro M24]
rename_existing: M24.1
description: Restore a parked print before restarting its SD stream
gcode:
  {% if printer.pause_resume.is_paused %}
    RESUME
  {% else %}
    M24.1
  {% endif %}

[gcode_macro M0]
description: Park for a slicer-requested stop
gcode:
  PAUSE

[gcode_macro M1]
description: Park for a slicer-requested optional stop
gcode:
  PAUSE

[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
description: Cancel Print
gcode:
  {% set z = printer.toolhead.position.z|float %}
  {% set cone_z = printer.toolhead.cone_start_z|float %}
  {% set homed_axes = printer.toolhead.homed_axes %}
  {% set homed = "x" in homed_axes and "y" in homed_axes and "z" in homed_axes %}
  M117 Cancelling Print
  TURN_OFF_HEATERS
  M107
  BASE_CANCEL_PRINT
  SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=valid VALUE=0
  SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=retracted VALUE=0
  EXHAUSTON
  UPDATE_DELAYED_GCODE ID=DELAYED_EXHAUSTOFF DURATION=300
  {% if homed and z < cone_z %}
    {% set lift = [10.0, cone_z-z]|min %}
    {% if lift > 0 %}
      SAVE_GCODE_STATE NAME=CANCEL_state
      G91
      G1 Z{lift} F3000
      RESTORE_GCODE_STATE NAME=CANCEL_state MOVE=0
    {% endif %}
  {% endif %}
  M117 Print Cancelled

[gcode_macro PROMPT_TAPE]
gcode:
    RESPOND TYPE=command MSG="action:prompt_begin Using Tape"
    RESPOND TYPE=command MSG="action:prompt_text Is tape applied to the bed?"
    RESPOND TYPE=command MSG="action:prompt_footer_button YES|TAPE_APPLIED|primary"
    RESPOND TYPE=command MSG="action:prompt_footer_button NO|NO_TAPE_APPLIED|error"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro NO_TAPE_APPLIED]
description: Remove 0.13mm painter's tape offset
gcode:
	BED_SURFACE OFFSET=0
    RESPOND TYPE=command MSG="action:prompt_end"

[gcode_macro TAPE_APPLIED]
description: Apply 0.13mm painter's tape offset
gcode:
	BED_SURFACE OFFSET=0.13
    RESPOND TYPE=command MSG="action:prompt_end"

[gcode_macro PREPARE_PA_CALIBRATION]
description: Prepare pressure advance calibration cube
gcode:
  SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY=1 ACCEL=500
  TUNING_TOWER COMMAND=SET_PRESSURE_ADVANCE PARAMETER=ADVANCE START=0 FACTOR=.020
  M117 PA Cal Prepped

[gcode_macro M300]
description: Beep
gcode:
  {% set S = params.S|default(1000)|int %}
  {% set P = params.P|default(100)|int %}
  {% if S > 0 and P > 0 %}
    SET_PIN PIN=BEEPER_pin VALUE=0.5 CYCLE_TIME={1.0/S}
    G4 P{P}
    SET_PIN PIN=BEEPER_pin VALUE=0
  {% endif %}

[gcode_macro FILAMENT_CHANGE]
description: Managed filament change alias
gcode:
  {% set temp = params.TEMP|default(0)|float %}
  {% if temp > 0 %}
    M600 S{temp}
  {% else %}
    M600
  {% endif %}

[gcode_macro _FILAMENT_MANAGER_HARDWARE_UNLOAD]
description: Internal physical filament unload routine
gcode:
  {% set temp = params.TEMP|default(240)|float %}
  {% set prompt = params.PROMPT|default(1)|int %}
  {% if printer.idle_timeout.state == "Printing" and not printer.pause_resume.is_paused %}
    {action_raise_error("Filament cannot be unloaded while an active print is running")}
  {% elif temp <= 0 or temp > 500 %}
    {action_raise_error("Invalid filament unload temperature")}
  {% else %}
    M117 Heating Hotend
    M109 S{temp}
    M117 Unloading Filament
    SAVE_GCODE_STATE NAME=hardware_unload_state
    M83
    G1 E5 F100
    {% for i in range(4) %}
      G1 E-50 F2000
    {% endfor %}
    {% for i in range(10) %}
      G1 E-50 F4000
    {% endfor %}
    M400
    RESTORE_GCODE_STATE NAME=hardware_unload_state MOVE=0
    M117 Filament Unloaded
    {% if prompt %}
      RESPOND TYPE=command MSG="action:prompt_begin Filament Unloaded"
      RESPOND TYPE=command MSG="action:prompt_text Filament has been successfully unloaded."
      RESPOND TYPE=command MSG="action:prompt_text Remove the filament from the printer."
      RESPOND TYPE=command MSG="action:prompt_footer_button OK|RESPOND TYPE=command MSG=action:prompt_end|primary"
      RESPOND TYPE=command MSG="action:prompt_show"
    {% endif %}
  {% endif %}

[gcode_macro _FILAMENT_MANAGER_HARDWARE_LOAD]
description: Internal physical filament load routine
gcode:
  {% set temp = params.TEMP|default(240)|float %}
  {% set prompt = params.PROMPT|default(1)|int %}
  {% if printer.idle_timeout.state == "Printing" and not printer.pause_resume.is_paused %}
    {action_raise_error("Filament cannot be loaded while an active print is running")}
  {% elif temp <= 0 or temp > 500 %}
    {action_raise_error("Invalid filament load temperature")}
  {% else %}
    M117 Heating Hotend
    M109 S{temp}
    M117 Loading Filament
    SAVE_GCODE_STATE NAME=hardware_load_state
    M83
    {% for i in range(10) %}
      G1 E50 F2000
    {% endfor %}
    {% for i in range(4) %}
      G1 E50 F360
    {% endfor %}
    M400
    RESTORE_GCODE_STATE NAME=hardware_load_state MOVE=0
    M117 Filament Loaded
    {% if prompt %}
      RESPOND TYPE=command MSG="action:prompt_begin Filament Loaded"
      RESPOND TYPE=command MSG="action:prompt_text Filament has been successfully loaded and purged."
      RESPOND TYPE=command MSG="action:prompt_footer_button OK|RESPOND TYPE=command MSG=action:prompt_end|primary"
      RESPOND TYPE=command MSG="action:prompt_show"
    {% endif %}
  {% endif %}

[gcode_macro PURGE_FILAMENT]
description: Purge Filament
gcode:
  {% if printer.idle_timeout.state == "Printing" and not printer.pause_resume.is_paused %}
    {action_raise_error("PURGE_FILAMENT cannot be used while printing")}
  {% elif not printer.extruder.can_extrude %}
    {action_raise_error("Extruder temperature too low")}
  {% endif %}
  M117 Purging Filament
  SAVE_GCODE_STATE NAME=purge_filament_state
  M83
  G1 E50 F360
  M400
  RESTORE_GCODE_STATE NAME=purge_filament_state MOVE=0
  M117 Purge Complete

[gcode_macro M900]
description: Set Pressure Advance
gcode:
  {% if 'K' in params %}
    {% if 'E' in params %}
      SET_PRESSURE_ADVANCE EXTRUDER={params.E} ADVANCE={params.K}
    {% else %}
      SET_PRESSURE_ADVANCE ADVANCE={params.K}
    {% endif %}
  {% endif %}

[gcode_macro HOTEND_LED]
gcode:
  {% if 'C' in params %}
  {% set B = params.B|default(0.3)|float %}
    {% if params.C == 'BLUE' %}
      SET_LED LED=hotend RED=0 GREEN=0 BLUE={B} TRANSMIT=1
    {% elif params.C == 'RED' %}
      SET_LED LED=hotend RED={B} GREEN=0 BLUE=0 TRANSMIT=1
    {% elif params.C == 'GREEN' %}
      SET_LED LED=hotend RED=0 GREEN={B} BLUE=0 TRANSMIT=1
    {% elif params.C == 'WHITE' %}
      SET_LED LED=hotend RED={B} GREEN={B} BLUE={B} TRANSMIT=1
    {% elif params.C == 'CYAN' %}
      SET_LED LED=hotend RED=0 GREEN={B} BLUE={B} TRANSMIT=1
    {% elif params.C == 'PURPLE' %}
      SET_LED LED=hotend RED={B} GREEN=0 BLUE={B} TRANSMIT=1
    {% elif params.C == 'YELLOW' %}
      SET_LED LED=hotend RED={B} GREEN={B} BLUE=0 TRANSMIT=1
    {% endif %}
  {% else %}
    SET_LED LED=hotend RED=0 GREEN=0 BLUE=0 TRANSMIT=1
  {% endif %}

[gcode_macro LIGHTON]
gcode:
  SET_GCODE_VARIABLE MACRO=LIGHTTOGGLE VARIABLE=value value=1
  {action_call_remote_method("set_device_power",
                             device="light",
                             state="on")}

[gcode_macro LIGHTOFF]
gcode:
  SET_GCODE_VARIABLE MACRO=LIGHTTOGGLE VARIABLE=value value=0
  {action_call_remote_method("set_device_power",
                             device="light",
                             state="off")}

[gcode_macro LIGHTTOGGLE]
variable_value: 0
gcode:
    M117 Light Toggle
  {% if printer["gcode_macro LIGHTTOGGLE"].value == 0 %}
      {action_call_remote_method("set_device_power",
                             device="light",
                             state="on")}
    SET_GCODE_VARIABLE MACRO=LIGHTTOGGLE VARIABLE=value value=1
  {% elif printer["gcode_macro LIGHTTOGGLE"].value == 1 %}
      {action_call_remote_method("set_device_power",
                             device="light",
                             state="off")}
    SET_GCODE_VARIABLE MACRO=LIGHTTOGGLE VARIABLE=value value=0
  {% endif %}

[gcode_macro M141]
description: Set chamber temperature
gcode:
  SET_HEATER_TEMPERATURE HEATER=chamber TARGET={params.S|float}

[gcode_macro M191]
description: Set and wait for chamber temperature
gcode:
  {% set target = params.S|float %}
  SET_HEATER_TEMPERATURE HEATER=chamber TARGET={target}
  {% if target > 0 %}
    TEMPERATURE_WAIT SENSOR="heater_generic chamber" MINIMUM={target}
  {% endif %}

[include filament-manager_macros.cfg]
