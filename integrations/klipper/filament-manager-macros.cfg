# Include this file from printer.cfg after confirming the required plate-side meshes exist.
# P4 means Side A of physical plate P4; P4b means Side B of that same plate.

[gcode_macro SET_ACTIVE_SPOOL]
description: Select the active Spoolman spool by numeric ID
gcode:
  {% if params.ID %}
    {% set spool_id = params.ID|int %}
    {action_call_remote_method("spoolman_set_active_spool", spool_id=spool_id)}
  {% else %}
    {action_raise_error("SET_ACTIVE_SPOOL requires ID=<Spoolman ID>")}
  {% endif %}

[gcode_macro CLEAR_ACTIVE_SPOOL]
description: Clear the active Spoolman spool
gcode:
  {action_call_remote_method("spoolman_set_active_spool", spool_id=None)}

[gcode_macro SELECT_BUILD_PLATE]
description: Validate a P-number plate side, persist the selection, and load its matching mesh
variable_active_plate: "UNSET"
gcode:
  {% set plate = params.PLATE|default("") %}
  {% set side_b = plate[-1:] == "b" %}
  {% set physical_plate = plate[:-1] if side_b else plate %}
  {% set plate_number = physical_plate[1:]|int if physical_plate|length > 1 else 0 %}
  {% if plate|length > 32 or plate_number < 1 or physical_plate != "P" ~ plate_number %}
    {action_raise_error("SELECT_BUILD_PLATE requires P<number> or P<number>b, for example P4 or P4b")}
  {% else %}
    BED_MESH_PROFILE LOAD={plate}
    SET_GCODE_VARIABLE MACRO=SELECT_BUILD_PLATE VARIABLE=active_plate VALUE="'{plate}'"
    SAVE_VARIABLE VARIABLE=filament_manager_active_plate VALUE="'{plate}'"
    {action_respond_info("Selected build plate " ~ plate ~ " and loaded mesh " ~ plate)}
  {% endif %}
